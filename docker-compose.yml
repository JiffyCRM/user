services:
  postgres:
    image: postgres:16-alpine
    container_name: user-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: user
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - user_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  user_pgdata: